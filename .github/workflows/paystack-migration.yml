name: Apply Sell In DMs Paystack Migration
on:
  push:
    branches: [vercel-compatibility]
permissions:
  contents: write
jobs:
  migrate:
    if: !contains(github.event.head_commit.message, '[paystack-migrated]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: vercel-compatibility}
      - name: Patch webhook
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("server/index.ts"); s=p.read_text()
          start=s.index("app.post('/api/payments/flutterwave/webhook'")
          end=s.index("app.use(express.json({ limit: '100kb' }));")
          block="""app.post('/api/payments/paystack/webhook', express.raw({ type: 'application/json' }), asyncRoute(async (req, res) => {
            const raw = Buffer.isBuffer(req.body) ? req.body : Buffer.from('');
            const signature = req.header('x-paystack-signature');
            if (!signature || !verifyPaystackWebhookSignature(raw, signature)) return sendError(res, 401, 'INVALID_WEBHOOK_SIGNATURE', 'The Paystack webhook signature could not be verified.');
            const payload = JSON.parse(raw.toString('utf8'));
            if (payload.event === 'charge.success') {
              const reference = payload?.data?.reference;
              if (!reference) return sendError(res, 400, 'MISSING_REFERENCE', 'The Paystack webhook did not include a transaction reference.');
              await fulfillVerifiedTransaction(await verifyFlutterwaveTransaction(String(reference)));
            }
            return res.status(200).json({ received: true });
          }));

          """
          s=s[:start]+block+s[end:]
          marker="  secureEqual,\n"
          if "verifyPaystackWebhookSignature" not in s[:s.index("const __dirname")]:
            s=s.replace(marker,marker+"  verifyPaystackWebhookSignature,\n",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.ts
          git diff --cached --quiet || git commit -m "feat: migrate staging webhook to Paystack [paystack-migrated]"
          git push
